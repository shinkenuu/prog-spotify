[project]
name = "spotify"
version = "0.1.0"
description = "Matches ProgArchives' artists and albums with Spotify's"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "spotipy>=2.25.0",
    "pymongo>=4.3.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tqdm>=4.65.0",
    "thefuzz>=0.19.0",
    "python-levenshtein>=0.21.0",
    "psycopg[binary]>=3.2.0",
    "click>=8.1.7",
]

[project.scripts]
progspot = "spotify.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
