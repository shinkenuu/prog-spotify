[project]
name = "spotify"
version = "0.1.0"
description = "Matches ProgArchives' artists and albums with Spotify's"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "spotipy>=2.25.0",
    "pymongo>=4.3.3",
    "pydantic>=1.10.7",
    "tqdm>=4.65.0",
    "thefuzz>=0.19.0",
    "python-levenshtein>=0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
